<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="304" viewBox="0 0 1120 304" role="img" aria-labelledby="title desc">
  <title id="title">Gökdemir Uzunkaya — Cloud Software Engineer</title>
  <desc id="desc">A dark navy profile banner with mint and blue accents. Gökdemir Uzunkaya, Java, Spring, AWS, Vue. A geometric stack of connected layers represents backend, cloud, and frontend engineering.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c30"/>
      <stop offset="0.62" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#112332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72f0cd"/>
      <stop offset="1" stop-color="#6ca8ff"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#264d63"/>
      <stop offset="1" stop-color="#132737"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#82b9c9" opacity="0.18"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="1118" height="302" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1120" height="304" fill="url(#background)"/>
    <rect x="648" width="472" height="304" fill="url(#grid)"/>
    <path d="M678 0 567 304" fill="none" stroke="#6daac5" stroke-opacity="0.09"/>
    <path d="M703 0 592 304" fill="none" stroke="#6daac5" stroke-opacity="0.05"/>
    <rect x="0" y="0" width="1120" height="3" fill="url(#accent)"/>

    <text x="54" y="47" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.7" fill="#7de7cd">CLOUD SOFTWARE ENGINEER</text>
    <text x="50" y="124" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="1" fill="#f2f6ff">GÖKDEMİR</text>
    <text x="50" y="193" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="1" fill="#f2f6ff">UZUNKAYA</text>
    <rect x="54" y="223" width="36" height="3" rx="1.5" fill="#7de7cd"/>
    <text x="54" y="262" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="0.7" fill="#b6c8db">Java  /  Spring  /  AWS  /  Vue</text>

    <text x="1065" y="45" text-anchor="end" font-family="'Courier New', monospace" font-size="12" letter-spacing="0.4" fill="#a3b8cd">@skyfelongrock</text>

    <g fill="none" stroke="#42637e">
      <ellipse cx="859" cy="153" rx="152" ry="91" stroke-opacity="0.27"/>
      <ellipse cx="859" cy="153" rx="120" ry="71" stroke-opacity="0.24"/>
      <path d="M671 154h49m278 0h68" stroke-opacity="0.6"/>
      <path d="M859 57V32m0 217v23" stroke-opacity="0.35"/>
    </g>
    <g fill="#7de7cd">
      <circle cx="719" cy="154" r="3"/>
      <circle cx="999" cy="154" r="3"/>
    </g>
    <circle cx="1048" cy="154" r="3" fill="#77aefd"/>

    <g stroke-linejoin="round" stroke-width="1.5">
      <path d="m770 178 89-49 89 49-89 49z" fill="#102131" stroke="#375a76"/>
      <path d="m770 147 89-49 89 49-89 49z" fill="url(#layer)" stroke="#649bc4"/>
      <path d="m770 116 89-49 89 49-89 49z" fill="#163a45" stroke="url(#accent)"/>
      <path d="m770 116 89 49 89-49" fill="none" stroke="#84f0d3" stroke-opacity="0.8"/>
      <path d="M859 165v31m0 0v31" fill="none" stroke="#77b5db" stroke-dasharray="3 5" stroke-opacity="0.75"/>
    </g>
    <g fill="#c1f8e8">
      <path d="m836 112-11 6 11 6" fill="none" stroke="#b6f4e2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m882 112 11 6-11 6" fill="none" stroke="#b6f4e2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m865 108-12 19" fill="none" stroke="#b6f4e2" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="1065" y="273" text-anchor="end" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.6" fill="#9bb4ca">BUILD. UNDERSTAND. IMPROVE.</text>
  </g>
  <rect x="0.75" y="0.75" width="1118.5" height="302.5" rx="20" fill="none" stroke="#294055" stroke-width="1.5"/>
</svg>
