name: Update contribution calendar
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/**
      - .github/workflows/contributions.yml

permissions:
  contents: read
concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test calendar validation and privacy labels
        run: node --test scripts/contributions.test.mjs
      - name: Fetch aggregate contribution calendar
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.PROFILE_CONTRIBUTIONS_TOKEN || github.token }}
          OWNER_TOKEN: ${{ secrets.PROFILE_CONTRIBUTIONS_TOKEN != '' }}
        run: node scripts/contributions.mjs
      - name: Commit only the generated SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/contributions.svg && git ls-files --error-unmatch assets/contributions.svg >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contributions.svg
          git commit -m 'chore: update contribution calendar'
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:master

